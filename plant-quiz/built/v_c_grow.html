<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Lilita+One&family=Fredoka:wght@500;600&family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-card-at-a-time quiz column, sticker-style cards with hard offset shadows, vine progress bar on top. */
:root{
  --bg:#EDF5E4; --card:#FFFFFF; --ink:#10281E; --muted:#4A6155; --line:#CADCC0;
  --leaf:#1B7F4F; --on-leaf:#FFFFFF; --pop:#B83A62; --popd:#7E2441; --on-pop:#FFFFFF; --pop-soft:#FFE3EB; --sun:#FFD54A; --on-sun:#10281E;
  --good:#17703F; --good-soft:#DDF3E4; --bad:#B5420F; --bad-soft:#FFE9DC; --edge:#10281E; --g1:#14532D; --g2:#2E9E5E; --g3:#86D6A3; --pot:#FF8FAB; --pot2:#E85C86; --blob:#D5EACB; --sky:#FFF1B8; --water:#9AD7FF;
  --bw:2px;--sh:0 5px 0 var(--edge);--osh:0 3px 0 var(--edge);--bsh:0 4px 0 var(--edge);--ash:0 0 0 var(--edge);--dw:800;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A14; --card:#15271E; --ink:#EAF4EA; --muted:#9DB5A6; --line:#27432F;
  --leaf:#4FD08A; --on-leaf:#06210F; --pop:#FF7FA3; --popd:#9A4A60; --on-pop:#2A0612; --pop-soft:#3A1B27; --sun:#FFD54A; --on-sun:#10281E;
  --good:#4FD08A; --good-soft:#143826; --bad:#FF9A6B; --bad-soft:#3A2417; --edge:#5FBF8A; --g1:#2C9A5F; --g2:#4FD08A; --g3:#A5EBC3; --pot:#E87C9B; --pot2:#C74B72; --blob:#1D3A2A; --sky:#3B3512; --water:#4FA8D8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A14; --card:#15271E; --ink:#EAF4EA; --muted:#9DB5A6; --line:#27432F;
  --leaf:#4FD08A; --on-leaf:#06210F; --pop:#FF7FA3; --popd:#9A4A60; --on-pop:#2A0612; --pop-soft:#3A1B27; --sun:#FFD54A; --on-sun:#10281E;
  --good:#4FD08A; --good-soft:#143826; --bad:#FF9A6B; --bad-soft:#3A2417; --edge:#5FBF8A; --g1:#2C9A5F; --g2:#4FD08A; --g3:#A5EBC3; --pot:#E87C9B; --pot2:#C74B72; --blob:#1D3A2A; --sky:#3B3512; --water:#4FA8D8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 110px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:640px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px;border-radius:10px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:var(--dw);font-size:18px}
.brand span{white-space:nowrap}.brand{font-size:17px}.brand svg{width:30px;height:30px;flex:none}
.brand .spacer{flex:1}
.link{background:none;border:0;padding:6px 2px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.bar{position:relative;height:12px;margin-top:12px;border:var(--bw) solid var(--edge);border-radius:99px;background:var(--card)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--leaf);border-radius:99px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.bar b{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;transition:left .5s cubic-bezier(.3,.9,.3,1)}
.steps{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}

/* cards */
.card{background:var(--card);border:var(--bw) solid var(--edge);border-radius:22px;box-shadow:var(--sh);padding:22px 18px}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.kicker{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--sun);color:var(--on-sun);padding:4px 10px;border-radius:99px;border:var(--bw) solid var(--edge);margin-bottom:14px}
.kicker.tf{background:var(--pop);color:var(--on-pop)}
.q{font-size:clamp(26px,6.4vw,34px);font-weight:var(--dw)}
.sub{color:var(--muted);margin-top:10px;font-size:16px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;padding:14px 16px;font-weight:600;line-height:1.35;box-shadow:var(--osh);transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover:not(:disabled){background:var(--good-soft)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:var(--ash)}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:var(--bw) solid var(--edge)}
.opt:disabled{cursor:default;opacity:.55;box-shadow:none;transform:translateY(3px)}
.opt.picked{opacity:1;background:var(--sun);color:var(--on-sun)}
.opt.picked .dot{background:var(--edge)}
.opt.right{opacity:1;background:var(--good-soft);border-color:var(--good)}
.opt.right .dot{background:var(--good);border-color:var(--good)}
.opt.wrong{opacity:1;background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .dot{background:var(--bad);border-color:var(--bad)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-family:var(--display);font-weight:var(--dw);font-size:22px;padding-block:18px}

/* reply bubble */
.reply{margin-top:18px;border:var(--bw) solid var(--edge);border-radius:18px;padding:16px;background:var(--pop-soft);animation:pop .35s ease both}
.reply.ok{background:var(--good-soft)}
.reply.no{background:var(--bad-soft)}
.reply.tip{background:var(--card)}
.reply .tag{font-family:var(--display);font-weight:var(--dw);font-size:19px;margin-bottom:4px}
.reply p{font-size:16.5px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--leaf);color:var(--on-leaf);border:var(--bw) solid var(--edge);border-radius:16px;box-shadow:var(--bsh);padding:14px 22px;font-family:var(--display);font-weight:var(--dw);font-size:19px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:var(--ash)}
.btn.pop{background:var(--pop);color:var(--on-pop)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.full{width:100%}
.next{margin-top:16px}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:20px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.stickybar .wrap{max-width:640px}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* intro */
.hero{padding-block:14px 4px}
.hrow{display:flex;gap:10px;align-items:center}
.htxt{min-width:0;flex:1}
.hrow .mini{flex:none;width:30%;max-width:130px;height:auto;overflow:visible}
.landing h1{font-size:clamp(26px,7.4vw,40px)}
.landing .lead{font-size:17px;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .opt{flex-direction:column;align-items:flex-start;gap:8px;padding:12px;font-size:16px}
.tiles .ic{width:44px;height:44px}
body.lp{background:linear-gradient(180deg,var(--blob) 0%,var(--bg) 62%)}
body.lp .top{background:transparent}
.calm{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:6px 10px}
.calm>*{position:relative;z-index:1}
.calm .drift{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fl{position:absolute;width:34px;height:34px;opacity:.4;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-22px) rotate(10deg)}}
.orb{position:relative;width:min(260px,70vw);aspect-ratio:1;display:grid;place-items:center;margin-top:2px}
.orb i{position:absolute;inset:0;border-radius:50%;background:var(--card);opacity:.55;animation:breathe 8s ease-in-out infinite}
.orb i:nth-child(2){inset:9%;opacity:.7;animation-delay:.25s}
.orb i:nth-child(3){inset:19%;opacity:.95;animation-delay:.5s}
.orbplant{position:relative;width:62%;height:auto;overflow:visible;animation:breathe 8s ease-in-out infinite;animation-delay:.5s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}
.breathe{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.calm h1{font-size:clamp(28px,7.6vw,40px);max-width:15em}
.calm .lead{font-size:18px;margin:0;max-width:22em;color:var(--ink)}
.trust{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.calm .welcome{align-self:stretch;margin-top:6px;background:var(--card)}
.btn{background:var(--pop);color:var(--on-pop)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.cta{position:relative;width:100%;max-width:360px;font-size:21px;padding:18px 24px;border-radius:99px}
.btn.cta::after{content:"";position:absolute;inset:-6px;border-radius:99px;border:3px solid var(--pop);opacity:0;animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.75;transform:scale(.98)}100%{opacity:0;transform:scale(1.07)}}
.btn .arr{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.btn:hover{filter:brightness(1.06)}
.opt:not(.pc):not(.tiles .opt):not(.tfrow .opt)::after{content:"\203a";margin-left:auto;font-size:28px;line-height:1;opacity:.55;padding-left:6px}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.tiles .opt{position:relative}
.tiles .opt::after{content:"\203a";position:absolute;right:12px;top:10px;font-size:26px;line-height:1;opacity:.5}
.stickybar{background:linear-gradient(to top,var(--bg) 65%,transparent)}
@media (prefers-reduced-motion:reduce){.orb i,.orbplant,.fl,.btn.cta::after,.btn .arr{animation:none!important}}
.landing .chips{gap:6px;margin-top:12px}
.landing .chip{font-size:12.5px;padding:3px 9px}
.fineprint{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.hero h1{font-size:clamp(30px,8.2vw,46px);font-weight:var(--dw)}
.landing .scene{max-width:170px}
symbol{overflow:visible}
.fig svg{overflow:visible}
.hero .lead{font-size:18px}
.hero h1 em{font-style:normal;color:var(--pop);white-space:nowrap}
.hero .lead{margin-top:10px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;border:var(--bw) solid var(--edge);background:var(--card)}
.field{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.field label{font-weight:700}
.field input{font:inherit;font-size:18px;padding:13px 14px;border:var(--bw) solid var(--edge);border-radius:14px;background:var(--bg);color:var(--ink);width:100%}
.back{background:#eaf3df}
.welcome{border-radius:18px;border:2px dashed var(--leaf);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.welcome p{font-weight:600;min-width:0}

/* result */
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:var(--dw);font-size:14px;padding:6px 12px;border-radius:99px;background:var(--sun);color:var(--on-sun);border:var(--bw) solid var(--edge)}
.res h1{font-size:clamp(32px,8.6vw,46px);font-weight:var(--dw);margin-top:12px}
.res h1 span{color:var(--pop)}
.res .tagline{margin-top:12px;font-size:18px}
.meter{display:flex;gap:6px;margin-top:16px}
.meter i{flex:1;height:12px;border:var(--bw) solid var(--edge);border-radius:99px;background:var(--card)}
.meter i.on{background:var(--leaf)}
.meterlab{font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.sec h2{font-size:26px;font-weight:var(--dw)}
.sec .when{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.items{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.items li{display:flex;gap:12px;align-items:flex-start;min-width:0}
.items .txt{min-width:0}
.items b{display:block;font-weight:700}
.items span.d{color:var(--muted);font-size:16px}
.chk{flex:none;width:26px;height:26px;margin-top:1px;border:var(--bw) solid var(--edge);border-radius:8px;background:var(--bg);display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--leaf)}
.chk[aria-checked="true"]::after{content:"";width:6px;height:12px;border:solid var(--on-leaf);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.items li.done .txt{opacity:.55;text-decoration:line-through}
.mark{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:var(--bw) solid var(--edge);display:grid;place-items:center;font-weight:var(--dw);font-size:15px;line-height:1}
.mark.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.mark.eye{background:var(--sun);color:var(--on-sun)}
.legacy{background:var(--leaf);color:var(--on-leaf)}
.legacy .items span.d,.legacy .sec .when{color:inherit;opacity:.92}
.legacy .mark{background:var(--card);color:var(--ink);border-color:var(--edge)}
details{border:var(--bw) solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink);padding:0 14px}
details+details{margin-top:10px}
summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:var(--dw)}
details[open] summary::after{content:"\2013"}
details ol{margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--ink)}
.doc{background:var(--pop-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:15px;z-index:9;max-width:calc(100% - 32px)}
.fine{font-size:13.5px;color:var(--muted);margin-top:6px}
.sym{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sym .opt{padding:14px 12px;font-size:16px}
@media (max-width:420px){.sym{grid-template-columns:1fr}}
.dx h3{font-size:24px;font-weight:var(--dw);margin-top:6px}
.deco{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.09}
main{position:relative;z-index:1}
.scene{display:block;width:100%;max-width:440px;height:auto;margin:4px auto 0}
.ic{flex:none;width:46px;height:46px;border:var(--bw) solid var(--edge);border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--edge)}
.ic svg{width:32px;height:32px}
.opt.picked .ic{background:var(--card)}
.plants{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{flex-direction:column;text-align:center;justify-content:flex-start;padding:12px 10px 14px;gap:4px}
.pc svg{overflow:visible;width:100%;max-width:120px;height:118px}
.plants .opt:last-child{grid-column:1/-1}
.plants .opt:last-child svg{height:90px}
.fig{display:flex;justify-content:center;background:var(--blob);border:var(--bw) solid var(--edge);border-radius:18px;margin-bottom:16px;padding-top:10px;overflow:hidden}
.fig svg{width:min(210px,62%);height:auto;display:block}
.landing{margin-bottom:6px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rl{display:flex;gap:10px;align-items:flex-start}
.rl svg{flex:none;width:34px;height:34px;color:var(--g2)}
.gate ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:8px;font-weight:600}
.gate li{display:flex;gap:10px;align-items:center}
.gate li svg{width:22px;height:22px;flex:none;color:var(--leaf)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* calm landing: single, solid, always-visible CTA */
.calm{gap:14px;padding-block:4px 6px}
.orb{width:clamp(168px,48vw,220px)}
.orb i{animation:breathe 10s ease-in-out infinite}
.orbplant{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}
.calm h1{font-size:clamp(26px,8vw,32px)}
.calm .lead{font-size:18px}
.fineprint{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.btn{box-shadow:0 4px 0 var(--popd)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--popd)}
.btn.cta{max-width:none;min-height:58px;font-size:20px;padding:14px 18px;white-space:nowrap}
.btn.cta::after{display:none}
.btn .arr{animation:none}
.stickybar{padding:12px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:var(--bw) solid var(--edge);box-shadow:0 -8px 22px rgba(0,0,0,.08)}
.stickybar .wrap{display:flex;flex-direction:column;gap:6px}
.stickybar .btn{width:100%}
.stickybar .trust{text-align:center;font-size:14px;color:var(--ink);opacity:.8}
body{padding-block:0 130px}

/* opening: value first, staged and animated */
.open{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.open h1{font-size:clamp(26px,7.4vw,32px)}
.open .lead{font-size:17px;margin:0}
.scene2{position:relative;border-radius:24px;background:var(--blob);overflow:hidden;display:flex;justify-content:center;align-items:flex-end;padding:8px 8px 0}
.scene2 .rays{position:absolute;inset:-25% -15%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.6) 40%,transparent 52%,rgba(255,255,255,.35) 64%,transparent 76%);animation:rays 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes rays{from{transform:translateX(-10%);opacity:.45}to{transform:translateX(10%);opacity:.9}}
.scene2 .sway{height:clamp(110px,19vh,170px);width:auto;aspect-ratio:240/260;flex:none;overflow:visible;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.rise{opacity:0;transform:translateY(10px);animation:rise .6s ease-out forwards}
@keyframes rise{to{opacity:1;transform:none}}
.ask{font-weight:700;font-size:18px;margin:4px 0 0}
.chips3{display:flex;flex-direction:column;gap:10px}
.chip3{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:66px;text-align:left;font:inherit;font-weight:700;font-size:18px;line-height:1.25;color:var(--ink);background:var(--card);border:var(--bw) solid var(--edge);border-radius:18px;padding:8px 40px 8px 12px;box-shadow:var(--osh);cursor:pointer;transition:transform .12s,background .2s}
.chip3::after{content:"\203a";position:absolute;right:16px;font-size:28px;opacity:.55}
.chip3:hover:not(:disabled){transform:translateY(-2px)}
.chip3:active:not(:disabled){transform:translateY(2px)}
.chip3.sel{background:var(--sun);color:var(--on-sun)}
.chip3:disabled{cursor:default}
.tipcard{display:flex;flex-direction:column;gap:12px}
.tipcard .q{margin:0}
.tipart{background:var(--blob);border-radius:18px;display:grid;place-items:center;padding:8px}
.finger{width:min(100%,260px);height:auto;overflow:visible}
.finger .fg{animation:poke 4s ease-in-out infinite}
@keyframes poke{0%,15%{transform:translateY(0)}45%,70%{transform:translateY(36px)}100%{transform:translateY(0)}}
.finger .rl{animation:rlab 4s ease-in-out infinite}
@keyframes rlab{0%,35%{opacity:.25}50%,70%{opacity:1}100%{opacity:.25}}
.tipbody{font-size:18px;margin:0}
.try{display:flex;align-items:center;gap:12px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:52px}
.try .tk{flex:none;width:26px;height:26px;border:var(--bw) solid var(--edge);border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.try[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.try[aria-pressed="true"] .tk{background:var(--leaf)}
.try[aria-pressed="true"] .tk::after{content:"";width:6px;height:12px;border:solid var(--on-leaf);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.btn.ghost.cta{background:var(--card);color:var(--ink);box-shadow:var(--osh)}
@media (prefers-reduced-motion:reduce){.rise{opacity:1!important;transform:none!important;animation:none!important}.scene2 .rays,.scene2 .sway,.finger .fg,.finger .rl{animation:none!important}.finger .fg{transform:translateY(30px)}.finger .rl{opacity:1}}

.tiny{margin:14px 0 0;font-weight:700;font-size:16px}
.tiny.ok{color:var(--good)}.tiny.no{color:var(--bad)}
.fig.crowd{gap:0;padding-inline:6px}
.fig.crowd svg{width:20%;flex:1 1 0;max-width:80px;height:auto}
.err{color:var(--bad);font-weight:700;margin:8px 0 0}
.btn:disabled{opacity:.7;cursor:default}

.qf{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.qf h1{font-size:clamp(26px,7.4vw,32px)}
.qf .lead{font-size:17px;margin:0}
.scene2.small{padding-top:4px}
.scene2.small .sway{height:clamp(64px,10vh,84px)}
.tipnote{display:flex;flex-direction:column;gap:2px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;padding:10px 12px;font-size:16px}
.tipnote b{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qf .ask{margin:2px 0 -2px}
.qf .tiles .opt{min-height:84px;padding:8px 10px;gap:6px}
.qf .tiles .ic{width:36px;height:36px;border-radius:11px}.qf .tiles .ic svg{width:26px;height:26px}
.qf .fineprint{margin:0}
.pickmsg{margin:0;min-height:22px;font-weight:700;color:var(--good)}
.btn.cta:disabled{background:var(--card);color:var(--muted);border:var(--bw) dashed var(--edge);box-shadow:none;opacity:1;cursor:default}

/* article (long read) */
.lr{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.lr h1{font-size:clamp(26px,7.4vw,32px)}
.lr .lead{font-size:17px;margin:0}
.tagp{align-self:flex-start;font-size:12px;font-weight:var(--dw);letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:var(--on-sun);border:var(--bw) solid var(--edge);border-radius:99px;padding:3px 10px}
.by{margin:-4px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.hero3{background:var(--blob);border:var(--bw) solid var(--edge);border-radius:22px;display:grid;place-items:center;padding:10px 10px 0}.hero3 svg{width:150px;height:auto}
.as{display:flex;flex-direction:column;gap:10px;margin-top:8px}.as p{margin:0;font-size:17px}
.as h3{font-size:22px}
figure.ph{margin:0}.ph .art{background:var(--blob);border-radius:18px;border:var(--bw) solid var(--edge);padding:6px;overflow:hidden}.ph svg{width:100%;height:auto;display:block}
figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.pq{margin:14px 0 6px;padding:14px 16px;border-left:5px solid var(--pop);background:var(--card);border-radius:0 16px 16px 0;font-family:var(--display);font-size:22px;line-height:1.2}
.inl{background:var(--pop-soft);border:var(--bw) solid var(--edge);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:8px}.inl p{margin:0;font-weight:700}
/* plan preview */
.sample{background:var(--card);border:var(--bw) solid var(--edge);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.ex{align-self:flex-start;font-size:12.5px;font-weight:var(--dw);letter-spacing:.05em;text-transform:uppercase;background:var(--sun);color:var(--on-sun);border-radius:99px;padding:4px 10px}
.sample b{font-family:var(--display);font-size:19px}
.row1{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:16.5px}
.bx{flex:none;width:24px;height:24px;border:var(--bw) solid var(--edge);border-radius:7px}
.sample .x,.sample .w{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:var(--dw)}.sample .x{background:var(--bad-soft);color:var(--bad)}.sample .w{background:var(--sun);color:var(--on-sun)}
.sample .s2,.sample .s3{border-top:1.5px dashed var(--edge);padding-top:10px}
/* growing plant */
.growscene{position:relative;border-radius:24px;background:var(--blob);overflow:hidden;display:flex;justify-content:center;align-items:flex-end;padding:8px 8px 0}
.growscene .rays{position:absolute;inset:-25% -15%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.6) 40%,transparent 52%,rgba(255,255,255,.35) 64%,transparent 76%);animation:rays 9s ease-in-out infinite alternate;pointer-events:none}
.growsvg{position:relative;height:clamp(190px,32vh,260px);width:auto;aspect-ratio:240/260;overflow:visible}
.gst{stroke-dasharray:1;stroke-dashoffset:1;animation:gdraw 3.6s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes gdraw{0%,12%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.gl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:gleaf 3.6s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes gleaf{0%,15%{transform:scale(0)}65%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.gst{animation:none!important;stroke-dashoffset:0}.gl{animation:none!important;transform:none}}

<script>
(function(){

/* ---------- QUESTIONS ---------- */
function TF(id,q,answer,ex,extra){

}
var PLANTS={monstera:'Monstera',pothos:'Pothos',fiddle:'Fiddle leaf fig',snake:'Snake plant',other:'houseplant'};
var isP=function(p){return function(S){return S.plant===p}};

var Q=[
{id:'why',kind:'feel',label:'Start here',when:function(){return false},q:'What brings you here today?',sub:'Tap one to start.',opts:[
 {t:'I inherited a plant. I’m scared.',add:{legacy:2,fear:2},h:'That’s a lot to hold.',r:'Being scared means you care. That’s a great start.'},
 {t:'I’m still learning',add:{fear:2,history:1},h:'Everyone starts here.',r:'Most of us do. We’ll find your habit together.'},
 {t:'My plant looks sad',add:{sad:1},h:'Good eye.',r:'Noticing is half of plant care. Let’s find out why.'},
 {t:'I want it big and lush',add:{grow:2},h:'Picture that leafy corner.',r:'Love it. Light is the big key, so we’ll check yours.'}
]},
{id:'plant',kind:'feel',label:'Meet your plant',q:'Which plant are we helping?',sub:'Pick the closest match.',opts:[
 {t:'Monstera (big split leaves)',set:'monstera',h:'Big and dramatic.',r:'We’ll go deep on yours.'},
 {t:'Pothos or philodendron vine',set:'pothos',h:'The shelf trailer.',r:'Pothos forgives a lot of mistakes.'},
 {t:'Fiddle leaf fig',set:'fiddle',h:'Brave choice.',r:'Fiddles seem like divas. We’ll make yours easy.'},
 {t:'Snake plant',set:'snake',h:'The “unkillable” one.',r:'Most die from too much love. We’ll fix that.'},

]},
{id:'story',kind:'feel',label:'Its story',q:'Which fits your Monstera best?',when:isP('monstera'),opts:[
 {t:'Huge and old. Just came to me.',add:{oldpot:2,legacy:1,moved:1},h:'It’s a survivor.',r:'It’s made it this far. For now, stay calm and steady.'},
 {t:'Huge and old. Mine for a while.',add:{oldpot:1},h:'You know its moods.',r:'That’s a head start. Give it more room, slowly.'},
 {t:'I’ve had it a year or two',add:{},h:'Good time for habits.',r:'You know it now. Let’s build a simple routine.'},
 {t:'I have a few of them',add:{},h:'A Monstera family.',r:'One plan covers all of them.'}
]},
{id:'light',kind:'feel',label:'Light check',q:'How’s the light where it lives?',opts:[
 {t:'Bright windows all day',add:{light:3},h:'That’s a gift.',r:'Bright light is great. Let sun in slowly, since sudden strong sun can scorch leaves.'},
 {t:'Bright room, no direct sun',add:{light:2},h:'Reading-nook light.',r:'Most houseplants love it as much as you would.'},
 {t:'Dim corner, far from windows',add:{light:1},k:'tip',h:'Dim corners are tough.',r:'Low light makes long, bare stems. A closer window often helps.'},
 {t:'No idea',add:{light:0},k:'tip',h:'Try the hand test.',r:'At noon, hold your hand over it. A sharp shadow means bright.'}
]},
{id:'water',kind:'feel',label:'Watering',q:'How do you decide to water?',opts:[
 {t:'Same day every week',add:{over:1},h:'A Sunday-routine person.',r:'Plants don’t read calendars. Check the soil first, then pour.'},
 {t:'I check the soil with a finger',add:{waterpro:1},k:'ok',h:'That’s the pro move.',r:'You already do what experts do. Keep going.'},
 {t:'When the leaves droop',add:{under:1},h:'You wait for it to speak.',r:'Drooping comes late. A soil check sooner saves it stress.'},
 {t:'Whenever I remember',add:{under:1,wing:1},h:'Life is busy.',r:'A weekly reminder to check, not water, fixes most of this.'}
]},
TF('myth2','A much bigger pot is always better.',false,{
 ok:'Right, it’s false. Extra soil stays wet and can rot roots. Go up about 2 inches.',

{id:'drain',kind:'feel',label:'Pot talk',q:'Does the pot have drainage holes?',opts:[
 {t:'Yes, and it has a saucer',add:{},k:'ok',h:'Good setup.',r:'Empty the saucer after watering so roots don’t sit in water.'},
 {t:'No holes, it’s a pretty pot',add:{drain:1},h:'Pretty pots are hard to resist.',r:'Keep it in a plastic pot with holes, set inside the pretty one.'},
 {t:'I’m not sure',add:{drain:1},h:'Quick check tonight.',r:'Tip the pot and look. Holes keep roots out of puddles.'}
]},
TF('myth3','A plant that just moved needs repotting right away.',false,{

{id:'m1',kind:'feel',label:'Your Monstera',q:'What shape is it in?',when:isP('monstera'),opts:[
 {t:'Long vines, flops without support',add:{leggy:2,nosupport:1},h:'Slumped like a teenager.',r:'Easy fix: a stake, trellis, or wall hooks. Long vines aren’t a bad sign.'},
 {t:'Long vines, well supported',add:{leggy:2},h:'You did the hard part.',r:'That trailing look comes from reaching for light. Keep the light good.'},
 {t:'A little leggy, leaves low down',add:{leggy:1},h:'There’s life low down.',r:'New growth will follow the light you give it.'},
 {t:'Full and bushy',add:{},k:'ok',h:'Lovely and full.',r:'Steady light will keep it that way.'}
]},
TF('m2','Cutting a Monstera stem will hurt it.',false,{
 ok:'Right, it’s false. A clean cut just above a bump on the stem is fine. Cuttings make a backup plant.',
 wrong:'Easy guess. It’s false. A clean cut above a stem bump is fine. That piece can root in water, giving you a backup.'},{when:isP('monstera')}),
{id:'p1',kind:'feel',label:'Your pothos',q:'Are the vines long and sparse?',when:isP('pothos'),opts:[
 {t:'Yes, long with gaps',add:{leggy:2},h:'Very common.',r:'Usually low light or no trims. Both are easy fixes.'},
 {t:'Full and bushy',add:{},k:'ok',h:'Gorgeous.',r:'It’s clearly getting what it needs.'}
]},
TF('p2','A pothos cutting can grow roots in water.',true,{

{id:'f1',kind:'feel',label:'Your fiddle',q:'Is it dropping leaves?',when:isP('fiddle'),opts:[

{id:'s2',kind:'feel',label:'Your snake plant',q:'How often do you water it?',when:isP('snake'),opts:[
 {t:'About every week',add:{over:2},h:'A caring routine.',r:'That may be too often. Try every 2 to 4 weeks, once fully dry.'},
 {t:'Every few weeks',add:{},k:'ok',h:'Right in the zone.',r:'It must like you.'},
 {t:'Barely ever',add:{},k:'ok',h:'Easy to love.',r:'It’s built for that.'}
]},
{id:'g1',kind:'feel',label:'Your plant',q:'What’s your plant upset about?',when:isP('other'),opts:[
 {t:'Yellow leaves',add:{cx:'yellow'},h:'Hard to miss.',r:'The Plant Doctor will help sort out why.'},
 {t:'Brown, crispy edges',add:{cx:'brown'},h:'Just a clue.',r:'The Plant Doctor can narrow it down.'},
 {t:'Drooping',add:{cx:'droop'},h:'Aw, droopy.',r:'Drooping says a lot. We’ll find out why.'},
 {t:'Bugs or sticky spots',add:{cx:'bugs'},h:'Gross, but common.',r:'It’s fixable, and the Plant Doctor can help.'},

/* ---------- ENGINE ---------- */
function byId(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i];return null}
function derive(answers){
  var mo=new Date().getMonth();
  var pre=(typeof st!=='undefined'&&st.pre)||null;
  var S={t:{season:(mo>=2&&mo<=5)?'grow':(mo>=6&&mo<=9)?'slow':'rest'},plant:null,tf:0,ok:0,mistakes:[]};
  if(pre)Object.keys(pre).forEach(function(k){var v=pre[k];S.t[k]=typeof v==='number'?(S.t[k]||0)+v:v});
  answers.forEach(function(a){
    var q=byId(a.id);if(!q)return;
    if(q.kind==='tf'){S.tf++;if((a.i===0)===q.answer)S.ok++;else S.mistakes.push(q.id)}
    else{var o=q.opts[a.i];if(!o)return;
      if(o.set)S.plant=o.set;
      if(o.add)Object.keys(o.add).forEach(function(k){var v=o.add[k];S.t[k]=typeof v==='number'?(S.t[k]||0)+v:v});
    }
  });
  return S;
}
function nextQ(S,answers){
  var done={};answers.forEach(function(a){done[a.id]=1});
  for(var i=0;i<Q.length;i++){var q=Q[i];if(!done[q.id]&&(!q.when||q.when(S)))return q}
  return null;
}
function totalQ(S,answers){
  var n=answers.length,done={};answers.forEach(function(a){done[a.id]=1});
  Q.forEach(function(q){if(done[q.id])return;
    var T2=S.plant===null?Object.assign({},S,{plant:'monstera'}):S;
    if(!q.when||q.when(T2))n++});
  return n;
}

/* ---------- VIEW STATE ---------- */
var st={name:'',answers:[],view:'intro',picked:null};

function setProg(show,pct,label,right){
  if(isGame()&&label){label=label.replace('Question','Level');right='\u2605 '+st.answers.length}
  document.body.classList.remove('lp');clearInterval(window._br);
  $('#prog').hidden=!show;$('#restart').hidden=!show&&st.view!=='result'&&st.view!=='doc';
  if(!show)return;
  $('#pfill').style.width=pct+'%';
  $('#pleaf').style.left=Math.max(2,Math.min(98,pct))+'%';
  $('.bar').setAttribute('aria-valuenow',Math.round(pct));

}

function save(done,fresh){var old=store(true)||{};store(false,{name:st.name,answers:st.answers,done:!!done,ts:(fresh?Date.now():old.ts)||Date.now(),checks:fresh?{}:(old.checks||{})})}
function track(e,p){try{p=p||{};p.event=e;p.ts=Date.now();(window.dataLayer=window.dataLayer||[]).push(p)}catch(x){}}

/* ---------- ILLUSTRATION HELPERS ---------- */
var PSYM={monstera:'plant-monstera',pothos:'plant-pothos',fiddle:'plant-fiddle',snake:'plant-snake',other:'plant-other'};
['plant','drain','pets','p1','f1','s2','g1'].forEach(function(id){var q=byId(id);if(q)q.opts.forEach(function(o){o.r=''})});
[0,1].forEach(function(i){byId('light').opts[i].r=''});
['myth3','m2','p2','f2','s1'].forEach(function(id){var q=byId(id);if(q)q.quick=true});
var IC={why:['i-heart','i-sprout','i-droop','i-up'],light:['i-window','i-lamp','i-dim','i-q'],water:['i-cal','i-drop','i-droop','i-cloud'],drain:['i-pot-holes','i-pot','i-q'],season:['i-sprout','i-fall','i-snow'],pets:['i-paw','i-kid','i-heart'],recent:['i-box','i-house'],goal:['i-heart','i-up','i-sprout','i-frame']};
Object.keys(IC).forEach(function(id){var q=byId(id);if(q)q.opts.forEach(function(o,i){o.ic=IC[id][i]})});

function optHTML(q,o,i){

function heroHTML(){
  var saved=store(true),w='';

    var days=saved.ts?Math.floor((Date.now()-saved.ts)/86400000):0;
    w='<div class="welcome" style="margin-top:12px"><p>Welcome back'+(saved.name?', '+esc(saved.name):'')+'. '+(days>=7?'It’s been '+days+' days. How do the leaves look?':'Your plan is saved here.')+'</p><button class="btn ghost" id="resume" style="padding:10px 16px;font-size:16px">'+(days>=7?'Check in':'See my plan')+'</button></div>';
  }
  return '<section class="hero landing"><div class="hrow"><div class="htxt"><h1>Scared to <em>kill</em> your inherited plant?</h1><p class="lead">Answer a few questions. Get a calm, simple plan.</p></div>'+svgUse('plant-monstera','0 0 240 260','mini')+'</div>'+
   '<div class="chips"><span class="chip">3 minutes</span><span class="chip">No judgment</span><span class="chip">No sign-up</span></div>'+w+'</section>';

  var leaves=[[52,174,-72,.75,'--g1',1.1],[190,178,68,.75,'--g1',1.3],[66,130,-42,1,'--g2',1.5],[178,124,38,1,'--g2',1.7],[116,102,-4,1.02,'--g3',1.9]];

   '<p class="fineprint">Based on standard houseplant care guidance. Not a substitute for a local nursery.</p></section>'+landingBar('See what it needs','About 2 minutes. No sign-up.','go1');
  $('#go1').onclick=function(){track('cta_click');foundPage()};bindResume();

function foundPage(){
  st.view='found';setProg(false);document.body.classList.add('lp');$('#restart').hidden=true;track('view_found');
  var tiles=['inherit','bought','gift','awhile'].map(function(k){var o=FOUND[k];return '<button class="opt" data-k="'+k+'"><span class="ic" aria-hidden="true">'+svgUse(o.ic,'0 0 32 32')+'</span><span>'+esc(o.t)+'</span></button>'}).join('');
  app.innerHTML='<section class="qf"><h1>How did this plant find you?</h1><p class="lead">One tap. We\u2019ll start there.</p><div class="opts tiles" role="radiogroup" aria-label="How did this plant find you?">'+tiles+'</div><p class="pickmsg" id="pm" role="status"></p>'+
   (LV==='game'?'':'<p><button class="link" id="goland">\u2190 Back</button></p>')+'</section>'+

function typeOf(S){
  var t=S.t;
  var T=[
   {n:'The Legacy Keeper',s:(t.legacy||0)*1.2,d:'You’re keeping a story alive. That kind of care helps a plant most.'},
   {n:'The Devoted Waterer',s:(t.over||0)*1.5+(t.drain||0),d:'You show up with love and water. Your plant wants a little more space.'},
   {n:'The Steady Hand',s:(t.waterpro||0)*2+(t.fear||0)*.4,d:'You look before you act. Trust your own checks.'},
   {n:'The Instinct Grower',s:(t.wing||0)+(t.under||0)+(t.grow||0)*.5,d:'You’re relaxed, and your plants feel it. Two simple habits make it reliable.'}
  ],best=T[2];

}

  if(t.leggy||t.keepasis)o.push('You like the vine look, so no chopping needed.');

  if(t.under)o.push('Watering slips your mind, so you get a weekly check.');

}

function plan(S){
  var t=S.t,p=S.plant,mon=p==='monstera',P={week:[],leave:[],soon:[],watch:[]};
  var add=function(sec,h,d){P[sec].push({h:h,d:d})};

  add('week','Check the soil first','Finger 2 inches deep (right for most houseplants). Dry? Water till it drains, then empty the saucer.');
  if((t.light||0)<=1)add('week','Move it near your brightest window','Even a few feet helps. Plants stretch when they reach for light.');
  if(t.light===3)add('week','Shade it from hot afternoon sun','Morning sun is fine. Pale or crispy spots mean pull back or add a curtain.');
  if(t.light===2)add('week','Keep the light steady','This light works. Moving it around stresses plants more.');
  if(t.drain)add('week','Fix the drainage','Use a plastic pot with holes inside the pretty one. Empty extra water.');
  if(t.over)add('week','Water less often','Skip the calendar. Water only when the top 2 inches are dry.');
  if(t.gift||t.newp)add('week','Settle your new plant','Move it to bright light, take off any plastic sleeve, and check the drain holes.');
  if(t.pets)add('week','Pick a safe spot','Keep leaves out of reach of pets and small kids.');
  if(mon&&t.nosupport)add('week','Prop up the heavy vines','Loosely tie stems to a stake, trellis, or wall hooks.');
  if(t.under)add('week','Set a weekly check reminder','Check the soil for ten seconds. Water only if it’s dry.');
  add('week','Take a photo today','You’ll love a before picture in three months.');

  add('leave','Fertilizer',t.moved?'Wait a month after a move. Stressed roots don’t need a push.':'Skip it for now. Fresh soil after repotting has plenty.');
  if(S.mistakes.indexOf('myth3')>-1||t.moved)add('leave','Repotting or pruning, for now','Give it 2 to 4 weeks to settle, unless roots look bad. Spring is the best time to repot.');
  if(mon&&(t.season==='rest'||t.season==='slow'))add('leave','A full repot, until spring','Refresh the top 2 to 3 inches of soil now. Repot March to June.');
  if(S.mistakes.indexOf('myth2')>-1||t.oldpot)add('leave','A giant new pot','Go up one size. Extra soil stays wet and can rot roots.');
  if(mon)add('leave','Cutting the main stem','You don’t need to prune. Leave the thick main stem and roots alone.');

  if(mon){
    add('soon','Repot day, done gently','Repot only if roots clearly need it. Use a heavy pot about 2 inches wider, with holes, plus a sturdy stake. Steps are below.');
    if(t.leggy||t.keepasis)add('soon','Keep the vine look','Tie long stems to a trellis or hooks. Vines are a real look.');
    add('soon','How much can I cut?','Cut just above a stem bump. Take under a third. Wear gloves.');
    add('soon','Tuck or tie new roots','Guide them into the soil or onto the support. Don’t cut them.');
    add('soon','Make a backup plant','Root a small cutting in water. It’s insurance for a plant you can’t replace.');
    if(t.grow)add('soon','Add light first','New leaves grow toward light. More light means fuller growth.');
  }else if(p==='pothos'){
    if(t.leggy)add('soon','Trim and replant for fullness','Snip below a stem bump, root in water, tuck back into the pot.');
    add('soon','Grow a free second plant','A cutting in water roots in a couple of weeks.');
  }else if(p==='fiddle'){
    add('soon','Pick one spot and stay','Bright, no drafts. Turn it a quarter turn each month.');
  }else if(p==='snake'){
    add('soon','Water less than you think','Every 2 to 4 weeks, only when fully dry. Even less in winter.');
  }else{
    add('soon','Change one thing','Pick light or watering. Wait two weeks and see.');
  }

  add('watch','Lots of yellow leaves','One old leaf is normal. Many at once often point to water or light.');
  add('watch','Mushy stems or sour soil smell','That’s a rot warning. Stop watering and check the roots.');
  if(mon||p==='pothos'||p==='fiddle')add('watch','Brown, crispy patches','That’s sunburn. Move it back or filter the light.');
  add('watch','Tiny webs, black flies, white fuzz','Those are pests. Catch them early and they’re easy to fix.');
  return P;
}

var SYM={
 yellow:{n:'Yellow leaves',q:'Where are the yellow leaves?',o:[

  {t:'Several at once, and the soil is still wet',d:'Likely overwatering',b:'Roots sitting in wet soil cannot breathe, and yellow leaves are the first signal.',s:['Stop watering until the top 2 to 3 inches are dry.','Check the pot has drainage and empty the saucer.','If the soil smells sour or the stems feel mushy, check the roots for rot.']},
  {t:'Yellowing, and the soil is bone dry for days',d:'Likely underwatering',b:'The plant is dropping leaves to save water.',s:['Water slowly until it drains from the bottom.','If water runs straight through, soak the pot in a sink for 20 minutes.','Check the soil every few days from now on.']},
  {t:'New growth looks pale yellow-green',d:'Likely low light or low nutrients',b:'Plants make pale leaves when they are short on light or food.',s:['Move it closer to a bright window.','Once settled, feed with diluted fertilizer during spring and summer.','Give it a few weeks to respond.']}]},
 brown:{n:'Brown crispy edges',q:'Which sounds closest?',o:[
  {t:'Crispy tips, and the soil dries out completely between waterings',d:'Inconsistent watering or dry air',b:'Swings between very dry and soaking can crisp the edges.',s:['Water more evenly: check often, water when the top inch or two is dry.','Group plants together or add a humidifier if the air is very dry.','Trim brown edges with clean scissors if you like. They will not turn green again.']},
  {t:'Brown patches only on the side facing the sun',d:'Sunburn',b:'Direct hot sun scorches leaves.',s:['Move it back from the glass or add a sheer curtain.','Trim badly burned leaves.','Keep morning sun, avoid harsh afternoon sun.']},
  {t:'Dark, soft, mushy spots',d:'Too much water or a fungal spot',b:'Wet soil and poor airflow can cause soft spots.',s:['Cut off the damaged leaf.','Let the soil dry out more between waterings.','Give the plant more airflow and avoid wetting the leaves.']}]},
 droop:{n:'Drooping',q:'What is the soil like right now?',o:[
  {t:'Dry, even a few inches down',d:'It is thirsty',b:'This is the easy one.',s:['Water slowly until it drains.','Expect it to perk up within a day or two.','Check soil more often next week.']},
  {t:'Wet or soggy',d:'Roots may be struggling',b:'Droopy plus wet soil can mean the roots are suffocating or rotting.',s:['Stop watering and move to a bright spot to dry out.','Tip it out of the pot and look at the roots. Healthy roots are firm and pale.','Cut away mushy roots and repot in fresh, chunky mix if needed.']},
  {t:'It just moved, and the soil is fine',d:'Transplant shock',b:'Plants often droop for a week or two after a change.',s:['Keep light and watering steady.','Do not repot, prune, or fertilize yet.','Give it two to three weeks.']}]},
 leggy:{n:'Long, stretched, sparse',q:'How bright is its spot?',o:[

  {t:'Bright already',d:'Natural vining habit',b:'Some plants simply grow long. That can be a look you love.',s:['Support the vines on a trellis or hooks.','Or trim above a node to encourage branching and root the cuttings.','Keep light steady.']}]},
 mush:{n:'Mushy or black stems',q:'Where is the damage?',o:[
  {t:'At the base of the stem near the soil',d:'Stem or root rot',b:'This is urgent but sometimes rescuable.',s:['Cut above the rot into healthy, firm tissue.','Root any healthy stem pieces with a node in water.','Discard rotted soil and disinfect the pot before reusing.']},
  {t:'Only on a few leaf tips',d:'Minor, probably watering or cold',b:'Not a rot problem yet.',s:['Trim damaged leaves.','Check for cold drafts or touching a cold window.','Water only when the top couple of inches are dry.']}]},
 bugs:{n:'Pests or sticky spots',q:'What do you see?',o:[
  {t:'Tiny webs and speckled leaves',d:'Likely spider mites',b:'They love dry, warm air.',s:['Rinse the whole plant in the shower.','Wipe leaves, tops and undersides.','Treat weekly with insecticidal soap or neem for 3 to 4 weeks.']},
